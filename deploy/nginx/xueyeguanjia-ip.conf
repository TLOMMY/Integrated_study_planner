# 学业管家 Nginx 配置 · 公网 IP + 纯 HTTP 模式（备案完成前临时使用，由 install.sh --ip 启用）
#
#   http://<公网IP>/          -> 网页版
#   http://<公网IP>/api/      -> 后端 FastAPI（127.0.0.1:8000）
#   http://<公网IP>/intro/    -> 介绍与下载页（deploy/landing）
#
# 注意：纯 HTTP 下浏览器不会注册 Service Worker（"断网可看"与"安装到桌面"不可用），密码以明文在网络上传输。
# 只用于测试与演示；完成备案后执行 `sudo bash deploy/install.sh 你的邮箱` 切换到域名 + HTTPS。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # 任意 Host（公网 IP）都由这里处理
    server_name _;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端：去掉 /api 前缀再转发（与开发时 Vite 代理一致）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 识别 / 规划较慢；SSE 流式回复不缓冲
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 介绍与下载页
    location = /intro { return 301 /intro/; }
    location /intro/ {
        alias /opt/xueyeguanjia/site/;
        index index.html;
        try_files $uri $uri/ /intro/index.html;
    }

    # 网页版：带 hash 的静态资源长期缓存，页面本身不缓存
    root /opt/xueyeguanjia/app/Frontend/dist;
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
