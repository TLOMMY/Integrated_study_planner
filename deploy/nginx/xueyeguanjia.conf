# 学业管家 Nginx 配置（Ubuntu：/etc/nginx/sites-available/xueyeguanjia.conf）
#
#   xueyeguanjia.com / www  -> 介绍与下载页（未部署时先跳转到网页版）
#   app.xueyeguanjia.com    -> 网页版（Vue 打包产物）
#   app.xueyeguanjia.com/api/ -> 后端 FastAPI（127.0.0.1:8000），网页 / exe / 安卓 / iOS 都连这里
#
# 证书由 certbot 自动写入（见 deploy/install.sh），首次部署前先注释掉 443 的 ssl_certificate 两行。

# HTTP 一律跳到 HTTPS（certbot 续期用的 /.well-known 除外）
server {
    listen 80;
    listen [::]:80;
    server_name xueyeguanjia.com www.xueyeguanjia.com app.xueyeguanjia.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# 主域名：介绍与下载页
server {
    # 兼容 Ubuntu 22.04（nginx 1.18）与 24.04（1.24）的写法
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xueyeguanjia.com www.xueyeguanjia.com;

    ssl_certificate     /etc/letsencrypt/live/xueyeguanjia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xueyeguanjia.com/privkey.pem;

    root /opt/xueyeguanjia/site;
    index index.html;
    location / {
        # 还没有放介绍页时，直接打开网页版
        try_files $uri $uri/ @app;
    }
    location @app { return 302 https://app.xueyeguanjia.com$request_uri; }
}

# 网页版 + 后端接口
server {
    # 兼容 Ubuntu 22.04（nginx 1.18）与 24.04（1.24）的写法
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.xueyeguanjia.com;

    ssl_certificate     /etc/letsencrypt/live/xueyeguanjia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xueyeguanjia.com/privkey.pem;

    # 课表 / 图片导入上限 5MB，留一点余量
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端：去掉 /api 前缀再转发（与开发时 Vite 代理一致）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 识别 / 规划较慢
        proxy_read_timeout 120s;
    }

    # 前端：带 hash 的静态资源长期缓存，页面本身不缓存
    root /opt/xueyeguanjia/app/Frontend/dist;
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / {
        # 单页应用：刷新 /timetable 等地址也返回首页
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
