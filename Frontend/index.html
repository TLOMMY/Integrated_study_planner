<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4F6EF7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="学业管家" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="课表、任务、番茄钟与成长激励一体化的大学生学习规划助手" />
    <title>学业管家 · 智能学习规划</title>
    <script>
      // 在 JS 包加载前先把深浅色和底色设对，避免深色主题打开时闪一下白屏（完整配色由 useTheme 写入）
      try {
        var boot = JSON.parse(localStorage.getItem('app-theme-boot') || 'null')
        if (boot) {
          document.documentElement.style.colorScheme = boot.dark ? 'dark' : 'light'
          if (boot.bg) document.documentElement.style.background = boot.bg
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
