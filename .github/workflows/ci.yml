# 学业管家 CI：push / PR 时跑后端测试、前端单测与构建；推送 v* 标签时额外构建未签名的安卓 APK 与 Windows 安装包，
# 作为 Actions artifact 上传（不签名、不发布 Release）。
# 推送到 main 且测试通过后，若配置了 DEPLOY_* 三个 Secret，则自动部署到服务器（见 deploy/setup-autodeploy.sh）。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main 上可能正在部署，不能中途取消，新推送排队等待
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend+AI-interface
    env:
      # 测试用临时库与内存邮件（见 tests/conftest.py），绝不访问外网，不需要任何 Key
      DEEPSEEK_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # requirements.txt 里的固定版本在 3.12 上全部有现成的 wheel
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend+AI-interface/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: 前端单测与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # prebuild 会先生成离线图标并校验图标名
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: Frontend/dist
          retention-days: 7

  deploy:
    name: 部署到服务器（仅 main）
    # 测试全部通过后才部署；未配置 Secrets 时跳过（见 deploy/setup-autodeploy.sh）
    # 推送到 main，或在 Actions 页面对 main 手动 Run workflow（用于测试 / 重新部署）
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: 检查部署配置
        id: check
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 DEPLOY_HOST / DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS，跳过部署"
          fi
      - name: 通过 SSH 执行部署
        if: steps.check.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 服务器端密钥被限定为只能执行 xueyeguanjia-deploy，这里不需要也不能指定命令
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 "deploy@$DEPLOY_HOST"
      - name: 确认服务正常
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 10 "https://$DEPLOY_HOST/api/health" || curl -fsS -m 10 "http://$DEPLOY_HOST/api/health"; then
              echo; echo "部署成功"; exit 0
            fi
            sleep 10
          done
          echo "::error::部署后健康检查失败，请在服务器上查看 journalctl -u xueyeguanjia -n 50"
          exit 1
      - name: 清理密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key

  android:
    name: 安卓 APK（未签名，仅标签）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 打包网页并同步到安卓工程
        working-directory: Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: 构建 debug APK（没有 keystore.properties 时不签名发布版）
        working-directory: Frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: Frontend/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  windows:
    name: Windows 安装包（未签名，仅标签）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      # 不做代码签名
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      # --publish never：只生成文件，不上传 GitHub Release（不需要 GH_TOKEN）
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: |
            desktop/dist/*.exe
          retention-days: 30
