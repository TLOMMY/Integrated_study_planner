# 学业管家 CI：push / PR 时跑后端测试、前端单测与构建；推送 v* 标签时额外构建未签名的安卓 APK 与 Windows 安装包，
# 作为 Actions artifact 上传（不签名、不发布 Release、不需要任何 secret）。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend+AI-interface
    env:
      # 测试用临时库与内存邮件（见 tests/conftest.py），绝不访问外网，不需要任何 Key
      DEEPSEEK_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # requirements.txt 里的固定版本在 3.12 上全部有现成的 wheel
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend+AI-interface/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: 前端单测与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # prebuild 会先生成离线图标并校验图标名
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: Frontend/dist
          retention-days: 7

  android:
    name: 安卓 APK（未签名，仅标签）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 打包网页并同步到安卓工程
        working-directory: Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: 构建 debug APK（没有 keystore.properties 时不签名发布版）
        working-directory: Frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: Frontend/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  windows:
    name: Windows 安装包（未签名，仅标签）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      # 不做代码签名
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      # --publish never：只生成文件，不上传 GitHub Release（不需要 GH_TOKEN）
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: |
            desktop/dist/*.exe
          retention-days: 30
